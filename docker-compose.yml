networks:
  dev:

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - './nginx/nginx.conf:/etc/nginx/nginx.conf'
    depends_on:
      - backend
      - frontend
    networks:
      - dev

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@pg:5432/shop
      REDIRECT_URI: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - dev

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
    networks:
      - dev

  pg:
    image: postgres:15
    environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d shop" ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - dev

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - dev

volumes:
  pg_data:
